# Contrôles du catalogue (Marketplace / HACS) : à faire passer sans "ignore",
# condition de l'inscription au catalogue hacs/default.
name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
